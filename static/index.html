<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taste Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238fa073'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffc6a5'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="top-wrap">
    <header class="top">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Taste Center</a>
      <nav class="main" id="nav" aria-label="Main">
        <a href="#/">Overview</a>
        <a href="#/library">Library</a>
        <a href="#/connections">Connections</a>
        <a href="#/eras">Eras</a>
        <a href="#/rhythms">Rhythms</a>
        <a href="#/decades">Decades</a>
        <a href="#/insights">Insights</a>
        <a href="#/upcoming">Upcoming</a>
      </nav>
      <div class="search" role="search">
        <label class="search-box">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search artists, tracks, albums" autocomplete="off" aria-label="Search artists, tracks and albums">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <div class="util">
        <a class="import-link" href="#/import" title="Import">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
          <span class="sr-only">Import</span><span id="job-badge" class="nav-badge" hidden></span></a>
        <a class="icon-btn" href="#/cleanup" title="Cleanup" aria-label="Cleanup">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="m16 22-1-4"/><path d="M19 13.99a1 1 0 0 0 1-1V12a2 2 0 0 0-2-2h-3a1 1 0 0 1-1-1V4a2 2 0 0 0-4 0v5a1 1 0 0 1-1 1H6a2 2 0 0 0-2 2v.99a1 1 0 0 0 1 1"/><path d="M5 14h14l1.973 6.767A1 1 0 0 1 20 22H4a1 1 0 0 1-.973-1.233z"/><path d="m8 22 1-4"/></svg></a>
        <button id="theme" class="icon-btn" type="button" aria-label="Dark theme" aria-pressed="false" title="Dark theme">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      </div>
    </header>
  </div>
  <main id="view"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="/static/charts.js"></script>
  <script src="/static/graph.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
